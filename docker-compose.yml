services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: campusmind
      POSTGRES_USER: campusmind
      POSTGRES_PASSWORD: campusmind
    ports:
      - "5432:5432"
    volumes:
      - campusmind_postgres:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  campusmind_postgres:
